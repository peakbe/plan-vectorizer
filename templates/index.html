<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArchPlan Studio - Éditeur de Plans Architecturaux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f7f5f0; color: #1e293b; }
        .font-serif-arch { font-family: 'Playfair Display', serif; }
        .font-tech { font-family: 'JetBrains Mono', monospace; }
        .blueprint-paper {
            background-color: #fbf9f4;
            background-image: radial-gradient(#d4cebc 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col select-none">

    <!-- En-tête -->
    <header class="bg-[#0f172a] text-white px-4 py-3 shadow-md flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center space-x-2">
            <div class="bg-[#cf6644] p-1.5 rounded-lg text-white">
                <i data-lucide="compass" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-serif-arch font-bold text-base tracking-wide">ArchPlan <span class="text-xs font-tech text-[#cf6644] bg-white/10 px-2 py-0.5 rounded-full ml-1">Studio</span></h1>
                <p id="current-project-title" class="text-[11px] text-slate-400">Projet : Maison Principale</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openProjectsModal()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center space-x-1 border border-slate-700">
                <i data-lucide="folder-open" class="w-3.5 h-3.5 text-slate-400"></i>
                <span class="hidden sm:inline">Mes Projets</span>
            </button>
            <button onclick="exportPDF()" class="bg-[#cf6644] hover:bg-[#b85839] text-white text-xs px-3 py-2 rounded-lg font-medium transition flex items-center space-x-1 shadow">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span>PDF A4</span>
            </button>
        </div>
    </header>

    <!-- Barre d'outils secondaire -->
    <nav class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between overflow-x-auto space-x-2 text-xs">
        <div class="flex items-center space-x-1.5 shrink-0">
            <button onclick="setTool('select')" id="btn-tool-select" class="tool-btn bg-slate-100 text-slate-700 px-3 py-1.5 rounded-md font-medium transition flex items-center space-x-1 hover:bg-slate-200">
                <i data-lucide="mouse-pointer" class="w-3.5 h-3.5"></i><span>Sélectionner</span>
            </button>
            <button onclick="setTool('wall')" id="btn-tool-wall" class="tool-btn bg-slate-900 text-white px-3 py-1.5 rounded-md font-medium transition flex items-center space-x-1">
                <i data-lucide="pen-tool" class="w-3.5 h-3.5"></i><span>Mur</span>
            </button>
            <button onclick="setTool('room')" id="btn-tool-room" class="tool-btn bg-slate-100 text-slate-700 px-3 py-1.5 rounded-md font-medium transition flex items-center space-x-1 hover:bg-slate-200">
                <i data-lucide="square" class="w-3.5 h-3.5 text-[#cf6644]"></i><span>Pièce (Carré/Rect.)</span>
            </button>
            <button onclick="setTool('door')" id="btn-tool-door" class="tool-btn bg-slate-100 text-slate-700 px-3 py-1.5 rounded-md font-medium transition flex items-center space-x-1 hover:bg-slate-200">
                <i data-lucide="door-open" class="w-3.5 h-3.5 text-blue-600"></i><span>Porte</span>
            </button>
            <button onclick="setTool('window')" id="btn-tool-window" class="tool-btn bg-slate-100 text-slate-700 px-3 py-1.5 rounded-md font-medium transition flex items-center space-x-1 hover:bg-slate-200">
                <i data-lucide="layout-grid" class="w-3.5 h-3.5 text-emerald-600"></i><span>Fenêtre</span>
            </button>
            <button onclick="setTool('stairs')" id="btn-tool-stairs" class="tool-btn bg-slate-100 text-slate-700 px-3 py-1.5 rounded-md font-medium transition flex items-center space-x-1 hover:bg-slate-200">
                <i data-lucide="align-justify" class="w-3.5 h-3.5"></i><span>Escalier</span>
            </button>
            <button onclick="setTool('text')" id="btn-tool-text" class="tool-btn bg-slate-100 text-slate-700 px-3 py-1.5 rounded-md font-medium transition flex items-center space-x-1 hover:bg-slate-200">
                <i data-lucide="type" class="w-3.5 h-3.5"></i><span>Texte</span>
            </button>
        </div>

        <div class="flex items-center space-x-2 shrink-0">
            <label class="flex items-center space-x-1 bg-amber-50 border border-amber-200 text-amber-800 px-2 py-1 rounded-md cursor-pointer">
                <input type="checkbox" id="chk-snap" checked class="w-3 h-3 text-amber-600 rounded">
                <span class="text-[11px] font-semibold">Snap 90°</span>
            </label>
            <button onclick="undoLast()" class="p-1.5 bg-slate-100 hover:bg-slate-200 rounded-md text-slate-700 transition" title="Annuler">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
            <button onclick="deleteSelected()" class="p-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-md transition" title="Supprimer la sélection">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
        </div>
    </nav>

    <!-- Zone de dessin -->
    <main class="flex-1 relative blueprint-paper overflow-hidden flex flex-col items-center justify-center p-2">
        
        <div id="bg-image-container" class="absolute inset-0 flex items-center justify-center pointer-events-none transition-opacity">
            <img id="imported-bg" src="" class="max-h-full max-w-full object-contain hidden" alt="Fond importé">
        </div>

        <!-- SVG Interactif -->
        <svg id="plan-canvas" class="w-full h-full cursor-crosshair z-10" viewBox="0 0 1000 700">
            <g id="walls-layer"></g>
            <g id="elements-layer"></g>
        </svg>

        <!-- Boutons d'arrière-plan -->
        <div class="absolute bottom-4 left-4 z-20 flex items-center space-x-2 bg-white/95 backdrop-blur border border-slate-200 p-2 rounded-xl shadow-md text-xs">
            <label class="cursor-pointer bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg flex items-center space-x-1 transition">
                <i data-lucide="image-plus" class="w-3.5 h-3.5"></i>
                <span>Importer Plan (JPEG/PDF)</span>
                <input type="file" id="bg-file-input" accept="image/*,application/pdf" class="hidden" onchange="handleBgImport(event)">
            </label>
            <button onclick="removeBgImage()" id="btn-remove-bg" class="hidden text-red-600 hover:bg-red-50 px-2 py-1.5 rounded-lg transition flex items-center space-x-1">
                <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                <span>Retirer fond</span>
            </button>
        </div>

        <!-- Panneau de Propriétés & Mesures -->
        <div class="absolute top-4 right-4 z-20 bg-white/95 backdrop-blur border border-slate-200 p-3 rounded-xl shadow-md text-xs space-y-2 w-64">
            <div class="flex justify-between font-bold text-slate-700 border-b pb-1">
                <span>Propriétés & Édition</span>
                <span id="selected-type-label" class="text-[#cf6644]">Aucun</span>
            </div>
            
            <div id="property-editor" class="space-y-2 text-slate-600">
                <p class="text-[11px] text-slate-400 italic">Sélectionnez un mur ou une pièce.</p>
            </div>
        </div>

    </main>

    <!-- Modale Projets -->
    <div id="modal-projects" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-serif-arch font-bold text-lg text-slate-800">Mes Projets</h3>
                <button onclick="closeProjectsModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="space-y-2 max-h-60 overflow-y-auto">
                <div class="flex items-center justify-between p-3 bg-slate-50 border rounded-xl hover:border-slate-300 cursor-pointer">
                    <div>
                        <p class="font-medium text-sm text-slate-800">Maison Principale (T4)</p>
                        <p class="text-[11px] text-slate-500">Actif</p>
                    </div>
                    <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full font-medium">En cours</span>
                </div>
            </div>
            <button onclick="closeProjectsModal()" class="w-full bg-[#cf6644] text-white py-2.5 rounded-xl font-medium text-xs">Fermer</button>
        </div>
    </div>

    <!-- Modale Photo Mur & IA -->
    <div id="modal-wall-photo" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-serif-arch font-bold text-lg text-slate-800">Photo & Placement Auto IA</h3>
                <button onclick="closeWallPhotoModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Mur cible sélectionné</label>
                    <p id="modal-target-wall-info" class="font-tech bg-slate-50 p-2 rounded border">Mur #0 (400 cm)</p>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Prendre / Importer la photo du mur</label>
                    <input type="file" id="wall-photo-file" accept="image/*" capture="environment" class="w-full text-xs text-slate-500">
                </div>
            </div>
            <div class="pt-2 flex space-x-2">
                <button onclick="closeWallPhotoModal()" class="w-full bg-slate-100 py-2.5 rounded-xl font-medium text-xs">Annuler</button>
                <button onclick="processWallPhotoAI()" class="w-full bg-[#cf6644] text-white py-2.5 rounded-xl font-medium text-xs">Lancer l'analyse & Placer</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let currentTool = 'wall';
        let selectedItem = null; // { type: 'wall'|'element'|'endpoint', index: number, handle: 'p1'|'p2' }
        let isDrawing = false;
        let isDragging = false;
        let startPoint = null;
        let dragOffset = { x: 0, y: 0 };
        
        let walls = [
            {x1: 250, y1: 150, x2: 750, y2: 150, length: 500},
            {x1: 750, y1: 150, x2: 750, y2: 550, length: 400},
            {x1: 750, y1: 550, x2: 250, y2: 550, length: 500},
            {x1: 250, y1: 550, x2: 250, y2: 150, length: 400}
        ];
        let elements = [
            { type: 'door', x: 450, y: 150, width: 80, rotation: 0, scaleX: 1, scaleY: 1 },
            { type: 'window', x: 600, y: 150, width: 100, rotation: 0, scaleX: 1, scaleY: 1 },
            { type: 'stairs', x: 550, y: 300, w: 100, h: 150, rotation: 0 },
            { type: 'text', x: 500, y: 350, text: 'Séjour (20.0 m²)', rotation: 0 }
        ];
        let historyStack = [];

        function saveState() {
            historyStack.push(JSON.stringify({ walls, elements }));
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.className = "tool-btn bg-slate-100 text-slate-700 px-3 py-1.5 rounded-md font-medium transition flex items-center space-x-1 hover:bg-slate-200";
            });
            document.getElementById(`btn-tool-${tool}`).className = "tool-btn bg-slate-900 text-white px-3 py-1.5 rounded-md font-medium transition flex items-center space-x-1";
            svgCanvas.style.cursor = tool === 'select' ? 'default' : 'crosshair';
        }

        const svgCanvas = document.getElementById('plan-canvas');

        function getSvgPoint(e) {
            const pt = svgCanvas.createSVGPoint();
            pt.x = e.clientX; pt.y = e.clientY;
            return pt.matrixTransform(svgCanvas.getScreenCTM().inverse());
        }

        svgCanvas.addEventListener('mousedown', (e) => {
            const svgP = getSvgPoint(e);
            const x = Math.round(svgP.x);
            const y = Math.round(svgP.y);

            if (currentTool === 'select') {
                // 1. Vérifier si on attrape une poignée (endpoint) d'un mur sélectionné
                if (selectedItem && selectedItem.type === 'wall') {
                    let w = walls[selectedItem.index];
                    if (Math.hypot(x - w.x1, y - w.y1) < 12) {
                        selectedItem = { type: 'endpoint', index: selectedItem.index, handle: 'p1' };
                        isDragging = true;
                        return;
                    }
                    if (Math.hypot(x - w.x2, y - w.y2) < 12) {
                        selectedItem = { type: 'endpoint', index: selectedItem.index, handle: 'p2' };
                        isDragging = true;
                        return;
                    }
                }

                // 2. Vérifier si on clique sur un texte de pièce pour le déplacer
                let foundElIndex = elements.findIndex(el => {
                    let w = el.w || el.width || 80;
                    let h = el.h || 50;
                    return x >= el.x - 30 && x <= el.x + w + 30 && y >= el.y - 20 && y <= el.y + h + 20;
                });

                if (foundElIndex !== -1) {
                    selectedItem = { type: 'element', index: foundElIndex };
                    isDragging = true;
                    dragOffset.x = x - elements[foundElIndex].x;
                    dragOffset.y = y - elements[foundElIndex].y;
                    updatePropertyPanel();
                    renderCanvas();
                    return;
                }

                // 3. Sinon vérifier si on clique sur un mur
                let foundWallIndex = walls.findIndex(w => {
                    let dist = distToSegment({x, y}, {x: w.x1, y: w.y1}, {x: w.x2, y: w.y2});
                    return dist < 12;
                });

                if (foundWallIndex !== -1) {
                    selectedItem = { type: 'wall', index: foundWallIndex };
                    updatePropertyPanel();
                    renderCanvas();
                    return;
                }

                selectedItem = null;
                updatePropertyPanel();
                renderCanvas();
            } else {
                saveState();
                isDrawing = true;
                startPoint = { x, y };
            }
        });

        svgCanvas.addEventListener('mousemove', (e) => {
            if (!isDragging || !selectedItem || currentTool !== 'select') return;
            const svgP = getSvgPoint(e);
            const x = Math.round(svgP.x);
            const y = Math.round(svgP.y);

            if (selectedItem.type === 'element') {
                let el = elements[selectedItem.index];
                el.x = x - dragOffset.x;
                el.y = y - dragOffset.y;
                renderCanvas();
            } else if (selectedItem.type === 'endpoint') {
                let w = walls[selectedItem.index];
                if (selectedItem.handle === 'p1') {
                    w.x1 = x; w.y1 = y;
                } else {
                    w.x2 = x; w.y2 = y;
                }
                w.length = Math.round(Math.hypot(w.x2 - w.x1, w.y2 - w.y1));
                updatePropertyPanel();
                renderCanvas();
            }
        });

        svgCanvas.addEventListener('mouseup', (e) => {
            if (isDragging) {
                isDragging = false;
                return;
            }

            if (!isDrawing) return;
            const svgP = getSvgPoint(e);
            let endX = Math.round(svgP.x);
            let endY = Math.round(svgP.y);

            const widthCm = Math.abs(endX - startPoint.x);
            const heightCm = Math.abs(endY - startPoint.y);

            saveState();

            if (currentTool === 'room' && widthCm > 20 && heightCm > 20) {
                let rx = Math.min(startPoint.x, endX);
                let ry = Math.min(startPoint.y, endY);
                let rw = widthCm;
                let rh = heightCm;

                walls.push({ x1: rx, y1: ry, x2: rx + rw, y2: ry, length: rw });
                walls.push({ x1: rx + rw, y1: ry, x2: rx + rw, y2: ry + rh, length: rh });
                walls.push({ x1: rx + rw, y1: ry + rh, x2: rx, y2: ry + rh, length: rw });
                walls.push({ x1: rx, y1: ry + rh, x2: rx, y2: ry, length: rh });

                let roomName = prompt("Nom de la pièce :", "Chambre");
                if (!roomName) roomName = "Pièce";
                let surfaceM2 = ((rw / 100) * (rh / 100)).toFixed(1);

                elements.push({
                    type: 'text',
                    x: rx + rw / 2,
                    y: ry + rh / 2,
                    text: `${roomName} (${surfaceM2} m²)`,
                    rotation: 0
                });

            } else if (currentTool === 'wall') {
                if (document.getElementById('chk-snap').checked) {
                    if (Math.abs(endX - startPoint.x) > Math.abs(endY - startPoint.y)) endY = startPoint.y;
                    else endX = startPoint.x;
                }
                let lengthCm = Math.round(Math.hypot(endX - startPoint.x, endY - startPoint.y));
                if (lengthCm > 10) {
                    walls.push({ x1: startPoint.x, y1: startPoint.y, x2: endX, y2: endY, length: lengthCm });
                }
            } else if (currentTool === 'door') {
                elements.push({ type: 'door', x: startPoint.x, y: startPoint.y, width: 80, rotation: 0, scaleX: 1, scaleY: 1 });
            } else if (currentTool === 'window') {
                elements.push({ type: 'window', x: startPoint.x, y: startPoint.y, width: 100, rotation: 0, scaleX: 1, scaleY: 1 });
            } else if (currentTool === 'stairs') {
                elements.push({ type: 'stairs', x: startPoint.x, y: startPoint.y, w: 100, h: 150, rotation: 0 });
            } else if (currentTool === 'text') {
                let txt = prompt("Texte de légende :", "Légende");
                if (txt) elements.push({ type: 'text', x: startPoint.x, y: startPoint.y, text: txt, rotation: 0 });
            }

            isDrawing = false;
            renderCanvas();
        });

        function distToSegment(p, p1, p2) {
            let l2 = (p2.x - p1.x)*(p2.x - p1.x) + (p2.y - p1.y)*(p2.y - p1.y);
            if (l2 === 0) return Math.hypot(p.x - p1.x, p.y - p1.y);
            let t =((p.x - p1.x)*(p2.x - p1.x) + (p.y - p1.y)*(p2.y - p1.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (p1.x + t * (p2.x - p1.x)), p.y - (p1.y + t * (p2.y - p1.y)));
        }

        function rotateSelected() {
            if (!selectedItem || selectedItem.type !== 'element') return;
            saveState();
            let el = elements[selectedItem.index];
            el.rotation = (el.rotation + 90) % 360;
            renderCanvas();
        }

        function mirrorSelected(axis) {
            if (!selectedItem || selectedItem.type !== 'element') return;
            saveState();
            let el = elements[selectedItem.index];
            if (axis === 'H') el.scaleX = (el.scaleX || 1) * -1;
            if (axis === 'V') el.scaleY = (el.scaleY || 1) * -1;
            renderCanvas();
        }

        function updatePropertyPanel() {
            const label = document.getElementById('selected-type-label');
            const editor = document.getElementById('property-editor');

            if (!selectedItem) {
                label.textContent = "Aucun";
                editor.innerHTML = `<p class="text-[11px] text-slate-400 italic">Sélectionnez un mur ou une pièce.</p>`;
                return;
            }

            if (selectedItem.type === 'wall' || selectedItem.type === 'endpoint') {
                let w = walls[selectedItem.index];
                label.textContent = `Mur #${selectedItem.index}`;
                editor.innerHTML = `
                    <div>
                        <label class="block text-[11px] font-medium text-slate-700 mb-1">Longueur (cm)</label>
                        <input type="number" id="input-dim-val" value="${w.length}" oninput="applyDimensionChange(this.value)" class="w-full bg-slate-50 border rounded-md p-1.5 font-tech text-xs">
                    </div>
                    <div class="pt-2">
                        <button onclick="openWallPhotoModal()" class="w-full bg-[#cf6644] hover:bg-[#b85839] text-white py-1.5 rounded-lg font-medium transition flex items-center justify-center space-x-1">
                            <i data-lucide="camera" class="w-3.5 h-3.5"></i>
                            <span>📸 Photo & Placer Ouvrants Auto</span>
                        </button>
                    </div>
                `;
            } else if (selectedItem.type === 'element') {
                let el = elements[selectedItem.index];
                label.textContent = `${el.type.charAt(0).toUpperCase() + el.type.slice(1)}`;
                let currentVal = el.width || el.w || 80;
                editor.innerHTML = `
                    <div>
                        <label class="block text-[11px] font-medium text-slate-700 mb-1">Largeur (cm)</label>
                        <input type="number" id="input-dim-val" value="${currentVal}" oninput="applyDimensionChange(this.value)" class="w-full bg-slate-50 border rounded-md p-1.5 font-tech text-xs">
                    </div>
                    <div class="pt-2 flex space-x-1">
                        <button onclick="rotateSelected()" class="w-1/2 bg-blue-600 text-white py-1.5 rounded-lg font-medium flex items-center justify-center space-x-1">
                            <i data-lucide="rotate-cw" class="w-3 h-3"></i><span>Pivoter</span>
                        </button>
                        <button onclick="mirrorSelected('H')" class="w-1/4 bg-slate-800 text-white py-1.5 rounded-lg text-[10px]">Miroir ↔</button>
                        <button onclick="mirrorSelected('V')" class="w-1/4 bg-slate-800 text-white py-1.5 rounded-lg text-[10px]">Miroir ↕</button>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function applyDimensionChange(newVal) {
            if (!selectedItem) return;
            let val = parseFloat(newVal);
            if (isNaN(val) || val <= 0) return;

            if (selectedItem.type === 'wall' || selectedItem.type === 'endpoint') {
                let w = walls[selectedItem.index];
                let angle = Math.atan2(w.y2 - w.y1, w.x2 - w.x1);
                w.length = val;
                w.x2 = Math.round(w.x1 + val * Math.cos(angle));
                w.y2 = Math.round(w.y1 + val * Math.sin(angle));
            } else if (selectedItem.type === 'element') {
                let el = elements[selectedItem.index];
                if (el.type === 'door' || el.type === 'window') el.width = val;
                else if (el.type === 'stairs') el.w = val;
            }
            renderCanvas();
        }

        function processWallPhotoAI() {
            if (!selectedItem || (selectedItem.type !== 'wall' && selectedItem.type !== 'endpoint')) return;
            let w = walls[selectedItem.index];

            const formData = new FormData();
            formData.append('wallLength', w.length);

            fetch('/api/detect-openings', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    saveState();
                    let angle = Math.atan2(w.y2 - w.y1, w.x2 - w.x1) * (180 / Math.PI);
                    data.openings.forEach(op => {
                        let ratio = op.position / w.length;
                        elements.push({
                            type: op.type === 'porte' ? 'door' : 'window',
                            x: Math.round(w.x1 + ratio * (w.x2 - w.x1)),
                            y: Math.round(w.y1 + ratio * (w.y2 - w.y1)),
                            width: op.width || 90,
                            rotation: Math.round(angle),
                            scaleX: 1, scaleY: 1
                        });
                    });
                    closeWallPhotoModal();
                    renderCanvas();
                    alert("Ouvrants placés automatiquement avec succès !");
                }
            });
        }

        function renderCanvas() {
            const wallsGroup = document.getElementById('walls-layer');
            const elementsGroup = document.getElementById('elements-layer');
            wallsGroup.innerHTML = '';
            elementsGroup.innerHTML = '';

            walls.forEach((w, index) => {
                let isSelected = (selectedItem && (selectedItem.type === 'wall' || selectedItem.type === 'endpoint') && selectedItem.index === index);
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', w.x1); line.setAttribute('y1', w.y1);
                line.setAttribute('x2', w.x2); line.setAttribute('y2', w.y2);
                line.setAttribute('stroke', isSelected ? '#cf6644' : '#0f172a');
                line.setAttribute('stroke-width', isSelected ? '10' : '8');
                line.setAttribute('stroke-linecap', 'square');
                wallsGroup.appendChild(line);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', (w.x1 + w.x2) / 2);
                text.setAttribute('y', (w.y1 + w.y2) / 2 - 10);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('class', 'font-tech text-[10px] fill-[#cf6644] font-semibold');
                text.textContent = (w.length || 400) + ' cm';
                wallsGroup.appendChild(text);

                // Poignées d'étirement aux extrémités si le mur est sélectionné
                if (isSelected) {
                    [ {cx: w.x1, cy: w.y1}, {cx: w.x2, cy: w.y2} ].forEach(pt => {
                        const handle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        handle.setAttribute('cx', pt.cx); handle.setAttribute('cy', pt.cy);
                        handle.setAttribute('r', '6');
                        handle.setAttribute('fill', '#ffffff');
                        handle.setAttribute('stroke', '#cf6644');
                        handle.setAttribute('stroke-width', '3');
                        wallsGroup.appendChild(handle);
                    });
                }
            });

            elements.forEach((el, index) => {
                let isSelected = (selectedItem && selectedItem.type === 'element' && selectedItem.index === index);
                let g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('transform', `translate(${el.x}, ${el.y}) rotate(${el.rotation || 0}) scale(${el.scaleX || 1}, ${el.scaleY || 1})`);

                if (el.type === 'door') {
                    const width = el.width || 80;
                    const arc = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    arc.setAttribute('d', `M 0 -${width} A ${width} ${width} 0 0 1 ${width} 0`);
                    arc.setAttribute('fill', 'none');
                    arc.setAttribute('stroke', isSelected ? '#e056fd' : '#2563eb');
                    arc.setAttribute('stroke-width', '1.5');
                    arc.setAttribute('stroke-dasharray', '3,3');
                    g.appendChild(arc);

                    const stopLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    stopLine.setAttribute('x1', `${width - 8}`); stopLine.setAttribute('y1', '0');
                    stopLine.setAttribute('x2', `${width + 8}`); stopLine.setAttribute('y2', '0');
                    stopLine.setAttribute('stroke', isSelected ? '#e056fd' : '#2563eb');
                    stopLine.setAttribute('stroke-width', '3');
                    g.appendChild(stopLine);

                    const leaf = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    leaf.setAttribute('x', '-3'); leaf.setAttribute('y', `-${width}`);
                    leaf.setAttribute('width', '6'); leaf.setAttribute('height', `${width}`);
                    leaf.setAttribute('fill', isSelected ? '#e056fd' : '#2563eb');
                    g.appendChild(leaf);

                    const baseCorner = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    baseCorner.setAttribute('x1', '-10'); baseCorner.setAttribute('y1', '0');
                    baseCorner.setAttribute('x2', '3'); baseCorner.setAttribute('y2', '0');
                    baseCorner.setAttribute('stroke', isSelected ? '#e056fd' : '#2563eb');
                    baseCorner.setAttribute('stroke-width', '3');
                    g.appendChild(baseCorner);

                } else if (el.type === 'window') {
                    const width = el.width || 100;
                    const winRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    winRect.setAttribute('x', '0'); winRect.setAttribute('y', '-4');
                    winRect.setAttribute('width', `${width}`); winRect.setAttribute('height', '8');
                    winRect.setAttribute('fill', '#e6f4ea');
                    winRect.setAttribute('stroke', isSelected ? '#e056fd' : '#16a34a');
                    winRect.setAttribute('stroke-width', '2');
                    g.appendChild(winRect);

                    const glassLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    glassLine.setAttribute('x1', '0'); glassLine.setAttribute('y1', '0');
                    glassLine.setAttribute('x2', `${width}`); glassLine.setAttribute('y2', '0');
                    glassLine.setAttribute('stroke', '#16a34a'); glassLine.setAttribute('stroke-width', '1');
                    g.appendChild(glassLine);

                } else if (el.type === 'text') {
                    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    t.setAttribute('x', '0'); t.setAttribute('y', '0');
                    t.setAttribute('text-anchor', 'middle');
                    t.setAttribute('class', `font-serif-arch text-sm font-bold ${isSelected ? 'fill-[#cf6644]' : 'fill-slate-800'}`);
                    t.textContent = el.text;
                    g.appendChild(t);

                } else if (el.type === 'stairs') {
                    const box = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    box.setAttribute('x', '0'); box.setAttribute('y', '0');
                    box.setAttribute('width', el.w); box.setAttribute('height', el.h);
                    box.setAttribute('fill', '#fff'); box.setAttribute('stroke', isSelected ? '#cf6644' : '#0f172a'); box.setAttribute('stroke-width', isSelected ? '3' : '2');
                    g.appendChild(box);
                    for(let i=1; i<8; i++) {
                        const step = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        step.setAttribute('x1', '0'); step.setAttribute('y1', (el.h/8)*i);
                        step.setAttribute('x2', el.w); step.setAttribute('y2', (el.h/8)*i);
                        step.setAttribute('stroke', '#0f172a'); step.setAttribute('stroke-width', '1');
                        g.appendChild(step);
                    }
                }

                elementsGroup.appendChild(g);
            });
        }

        function undoLast() {
            if (historyStack.length > 0) {
                let prevState = JSON.parse(historyStack.pop());
                walls = prevState.walls;
                elements = prevState.elements;
                selectedItem = null;
                updatePropertyPanel();
                renderCanvas();
            }
        }

        function deleteSelected() {
            if (!selectedItem) { alert("Sélectionnez un élément à supprimer."); return; }
            saveState();
            if (selectedItem.type === 'wall' || selectedItem.type === 'endpoint') walls.splice(selectedItem.index, 1);
            else if (selectedItem.type === 'element') elements.splice(selectedItem.index, 1);
            selectedItem = null;
            updatePropertyPanel();
            renderCanvas();
        }

        function handleBgImport(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('imported-bg');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('btn-remove-bg').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function removeBgImage() {
            document.getElementById('imported-bg').src = '';
            document.getElementById('imported-bg').classList.add('hidden');
            document.getElementById('btn-remove-bg').classList.add('hidden');
            document.getElementById('bg-file-input').value = '';
        }

        function openProjectsModal() { document.getElementById('modal-projects').classList.remove('hidden'); }
        function closeProjectsModal() { document.getElementById('modal-projects').classList.add('hidden'); }
        function openWallPhotoModal() {
            if (!selectedItem || (selectedItem.type !== 'wall' && selectedItem.type !== 'endpoint')) return;
            let w = walls[selectedItem.index];
            document.getElementById('modal-target-wall-info').textContent = `Mur #${selectedItem.index} (${w.length} cm)`;
            document.getElementById('modal-wall-photo').classList.remove('hidden');
        }
        function closeWallPhotoModal() { document.getElementById('modal-wall-photo').classList.add('hidden'); }

        function exportPDF() {
            fetch('/api/export-pdf', { method: 'POST' })
            .then(res => res.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'plan_architecte.pdf';
                document.body.appendChild(a); a.click(); a.remove();
            });
        }

        renderCanvas();
    </script>
</body>
</html>
